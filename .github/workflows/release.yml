# Harbor's release: the Linux desktop build and the legacy and mainline APKs, attached to the
# GitHub release of a pushed vX.Y.Z tag (or of an existing tag, by hand).
#
# - Builds only on a tag push or a deliberate manual run, never on branch pushes.
# - One job creates the release; the build legs then attach their files to it.
# - GitHub-hosted runners, through harbor-build.yml (shared with nightly.yml).
# - dry_run (manual): builds every leg from the tag, or from the dispatched ref when no tag is
#   given; creates no release, signs nothing and attaches nothing.
# - Nothing goes through workflow artifacts (the organisation's artifact quota): each leg attaches
#   its file to the release itself.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to build and attach to (optional for a dry run)'
        required: false
        default: ''
      dry_run:
        description: 'Build everything; no release, no signing, nothing attached'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: harbor-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GIT_TAG_NAME: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Create the release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check the tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.TAG;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
              core.setFailed(`${tag} is not a vX.Y.Z tag`);
              return;
            }
            try {
              await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}` });
            } catch (error) {
              core.setFailed(`Tag ${tag} does not exist in ${context.repo.owner}/${context.repo.repo}`);
            }

      # The only job that creates the release: the build legs wait for it and attach.
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Harbor ${{ env.TAG }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true

  build-hosted:
    name: Build
    needs: [release]
    # A dry run skips the release job; the build still runs.
    if: ${{ !cancelled() && (needs.release.result == 'success' || (inputs.dry_run && needs.release.result == 'skipped')) }}
    uses: ./.github/workflows/harbor-build.yml
    secrets: inherit
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      ref: ${{ inputs.tag || github.sha }}
      version: ${{ inputs.tag || github.ref_name }}
      dry_run: ${{ inputs.dry_run || false }}
